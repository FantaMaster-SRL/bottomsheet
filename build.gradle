// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    VERSION = readVersion()
}

tasks.register('bumpMajor') {
    doLast {
        ant.propertyfile(file: 'version.properties') {
            entry(key: 'major', type: 'int', operation: '+', value: 1)
            entry(key: 'minor', type: 'int', operation: '=', value: 0)
            entry(key: 'patch', type: 'int', operation: '=', value: 0)
        }
    }
}

tasks.register('bumpMinor') {
    doLast {
        ant.propertyfile(file: 'version.properties') {
            entry(key: 'minor', type: 'int', operation: '+', value: 1)
            entry(key: 'patch', type: 'int', operation: '=', value: 0)
        }
    }
}

tasks.register('bumpPatch') {
    doLast {
        ant.propertyfile(file: 'version.properties') {
            entry(key: 'patch', type: 'int', operation: '+', value: 1)
        }
    }
}

tasks.register('genReadMe') {
    doLast {
        def template = file('README.md.template').text
        def result = template.replaceAll("%%version%%", readVersion())
        file("README.md").withWriter { it << result }
    }
}

tasks.register('printVersion') {
    doLast {
        println readVersion()
    }
}

String readVersion() {
    def versionProps = new Properties()
    file('version.properties').withInputStream { versionProps.load(it) }
    return versionProps['major'] + "." + versionProps['minor'] + "." + versionProps['patch']
}
